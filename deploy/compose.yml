services:
  nihongo:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: nihongo-web
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m
    expose:
      - "8080"
    networks:
      - traefik_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_network"
      - "traefik.http.routers.nihongo.rule=Host(`nihongo.kiwinokoto.fr`)"
      - "traefik.http.routers.nihongo.entrypoints=websecure"
      - "traefik.http.routers.nihongo.tls=true"
      - "traefik.http.routers.nihongo.tls.certresolver=letsencrypt"
      - "traefik.http.services.nihongo.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  traefik_network:
    external: true
    name: traefik_network
